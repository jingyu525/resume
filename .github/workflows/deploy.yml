name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 埋点为可选项：在仓库 Settings → Secrets and variables → Variables 中
      # 设置 VITE_GOATCOUNTER_CODE（及可选 VITE_GOATCOUNTER_SRC）才会开启；
      # 未设置则构建产物默认零外部请求。
      - name: Build
        run: npm run build
        env:
          VITE_GOATCOUNTER_CODE: ${{ vars.VITE_GOATCOUNTER_CODE || '' }}
          VITE_GOATCOUNTER_SRC: ${{ vars.VITE_GOATCOUNTER_SRC || 'https://gc.zgo.at/count.js' }}

      # SPA 深链回退：GitHub Pages 无服务端重写，直接打开 /resume/editor 会 404。
      # 把 index.html 复制为 404.html，让未知路径也返回 SPA 外壳，由前端路由接管。
      - name: SPA fallback (deep-link 404 fix)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
